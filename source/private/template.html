<html>

<head>
    <title>vTitle</title>
    <style>
        /* Base table styling */
        #tbl {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            border-collapse: collapse;
        }

        /* Table cells */
        #tbl td,
        #tbl th {
            font-size: 13px;
            padding: 8px 10px;
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            text-align: left;
            vertical-align: top;
            color: #252522;
            word-wrap: break-word;
            word-break: break-word;
        }

        /* Header row */
        #tbl th {
            font-size: 14px;
            font-weight: 600;
            background-color: #ffffff;
        }

        /* Section title */
        #tbl th.section {
            font-family: Tahoma, Geneva, Verdana, sans-serif;
            font-size: 26px;
            font-weight: bold;
            border: none;
            padding: 12px 10px;
            background-color: #ffffff;
            color: #000000;
        }

        /* Table header/summary cells */
        #tbl td.head {
            font-size: 18px;
            font-weight: 600;
            border: none;
            padding: 10px;
        }

        /* Zebra striping for readability */
        #tbl tr:nth-child(even) td {
            background-color: #f8f8f8;
        }

        /* Hover highlight (browser only, safe for reports) */
        #tbl tr:hover td {
            background-color: #eef4ff;
        }

        /* Reduce spacing for dense audit data */
        #tbl td b {
            white-space: nowrap;
        }

        /* Make long values readable */
        #tbl td {
            max-width: 0;
        }
    </style>
</head>

<body>

    <table id="tbl">
        <tr>
            <th class="section">Exchange Admin Activity Audit Report</th>
        </tr>
        <tr>
            <td class="head"><b>vOrganization</b></td>
        </tr>
    </table>

    <table id="tbl">
        <tr>
            <td>
                <b>Report</b><br>
                &nbsp;&nbsp;&nbsp;&gt; Time zone : vTimeZone<br>
                &nbsp;&nbsp;&nbsp;&gt; Date generated : vDateGenerated<br>
                &nbsp;&nbsp;&nbsp;&gt; Start date : vStartDate<br>
                &nbsp;&nbsp;&nbsp;&gt; End date : vEndDate<br>
                <b>Result</b><br>
                &nbsp;&nbsp;&nbsp;&gt; Count : vCount<br>
                &nbsp;&nbsp;&nbsp;&gt; Oldest : vOldest<br>
                &nbsp;&nbsp;&nbsp;&gt; Newest : vNewest<br>
            </td>
        </tr>
    </table>

    <table id="tbl">
        <!-- <tr>
            <td><b>Event</b></td>
            <td><b>Commands and Parameters</b></td>
        </tr> -->
        vRow
    </table>

    <table id="tbl">
        <tr>
            <td class="head">
                <a href="vRepoUrl" target="_blank">
                    vModuleInfo
                </a>
            </td>
        </tr>
    </table>

</body>

</html>
